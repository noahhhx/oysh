name: "Maven Release"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "release=$VERSION" >> $GITHUB_OUTPUT

      - name: Set release version
        run: mvn versions:set -DnewVersion="${{ steps.version.outputs.release }}" -DgenerateBackupPoms=false

      - name: Commit release version and update tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          shopt -s globstar
          git add **/pom.xml
          git commit -m "Release ${{ steps.version.outputs.release }}"
          if [ "${{ github.event_name }}" = "release" ]; then
            git tag -f "${{ github.ref_name }}"
          fi
          git push origin main
          if [ "${{ github.event_name }}" = "release" ]; then
            git push origin "${{ github.ref_name }}" --force
          fi

      - name: Publish artifact
        run: mvn clean deploy -P deployment

      - name: Determine next snapshot version
        id: next
        if: success()
        run: |
          IFS='.' read -ra PARTS <<< "${{ steps.version.outputs.release }}"
          NEXT_PATCH=$((PARTS[2] + 1))
          NEXT="${PARTS[0]}.${PARTS[1]}.$NEXT_PATCH-SNAPSHOT"
          echo "version=$NEXT" >> $GITHUB_OUTPUT

      - name: Bump to next snapshot
        if: success()
        run: mvn versions:set -DnewVersion="${{ steps.next.outputs.version }}" -DgenerateBackupPoms=false

      - name: Commit next snapshot
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          shopt -s globstar
          git add **/pom.xml
          git commit -m "Prepare next development version ${{ steps.next.outputs.version }}"
          git push origin main
